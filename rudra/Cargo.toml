[workspace]
members = [".", "builder"]
resolver = "2"

[package]
name = "rudra"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11"
x86_64 = "0.15"
uart_16550 = "0.2.19"
spin = "0.9.8"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
embedded-graphics = "0.8"
pic8259 = "0.10"
pc-keyboard = "0.7"
